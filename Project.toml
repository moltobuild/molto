# Molto's own manifest (dogfooding, see rfcs/0003-project-manifest.md).
#
# Note what this file does NOT say: no compiler binary, no version. The code
# needs C23 attributes — a property of the code. Which local binary provides
# them is a property of the machine, and pickup answers that. The Makefile has
# to hardcode `gcc-12` precisely because it cannot ask.
#
# This manifest builds molto: `molto build` and `molto test` both work on it.
# The Makefile remains as the bootstrap — something has to compile the first
# molto — not because molto is unable.
[package]
name = "molto"
version = "0.64.0"
description = "A package manager and build system for C and C++"
repository = "https://github.com/moltobuild/molto"
# The key states a licence; LICENSE and NOTICE at the root grant it. Apache-2.0
# for the patent grant above all: molto executes other people's compilers and
# its registry distributes other people's code, so a bare permissive licence
# leaves the one risk this project actually carries unaddressed.
license = "Apache-2.0"

[target]
std = "c2x"
requires = ["attr_nodiscard"]
defines = ["_DEFAULT_SOURCE", "__USE_MINGW_ANSI_STDIO=1"]
include = ["include"]
flags = ["-Wall", "-Wextra", "-Wpedantic", "-pthread"]

[test]
# The suite registers its cases and moltest owns main(), so everything links
# into one executable.
mode = "single"

# What git answers, without git: its failures are the paths a real repository
# cannot be made to take on demand. Linked alone, without the real processes.
[[test.isolated]]
file = "tests/services/test_source_service_git.c"
replaces = ["src/services/process_service.c"]

# What curl answers, without curl or a network: the failures a real registry
# cannot be made to give, and where the credential goes on the command line.
[[test.isolated]]
file = "tests/services/test_registry_service_curl.c"
replaces = ["src/services/process_service.c"]

# What the registry answers, without a registry: every status, and an answer
# about another coordinate than the one asked for.
[[test.isolated]]
file = "tests/services/test_resolve_service_registry.c"
replaces = ["src/services/registry_service.c"]

# A small registry and a fetcher that only counts: the walk, the downloads it
# puts off, and the search for a way out of a conflict.
[[test.isolated]]
file = "tests/services/test_dep_graph_registry.c"
replaces = ["src/services/resolve_service.c", "src/services/source_service.c"]

# Development dependencies come from molto's shared store, fetched once and
# reused by every project that names the same tag. The suite is therefore built
# by molto: the bootstrap Makefile builds the first molto and nothing else, and
# its `test` and `coverage` targets hand over to it.
[dev-deps]
moltest = { git = "https://github.com/moltobuild/moltest", rev = "9e0611007d3b1ccebd589273dd14a7a229265c3c" }
# The coverage report and its floor (moltest-coverage.toml), at the end of
# `molto test --profile coverage` (RFC-0019).
moltest_coverage = { git = "https://github.com/moltobuild/moltest-coverage", rev = "89186fcc19fc9d7389be331a0df3b9bf4e30259e" }
# Fakes for the isolated tests below, the ones that replace a source (RFC-0021).
moltest_mock = { git = "https://github.com/moltobuild/moltest-mock", rev = "4c168f5dd691f270fe5b4eb78416a2fc0754cfe3" }

[profile.debug]
opt_level = 0
debug_info = true

[profile.release]
opt_level = 3
debug_info = false

# What CI's sanitizers job builds: `molto test --profile custom`. Flags in a
# profile reach the compile and the link line, which the runtime needs.
[profile.custom]
opt_level = 0
debug_info = true
flags = ["-fsanitize=address,undefined", "-fno-omit-frame-pointer"]
