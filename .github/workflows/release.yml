name: Release

# A tag is what publishes. Nothing here runs on a branch, so a release is
# always something someone decided to make rather than something a merge did.
on:
  push:
    tags: ["v*"]

  # A rehearsal. `build` and `windows` run; `publish` does not, because there
  # is no tag to publish under. It exists because the only other way to find
  # out whether this file works is to spend a version number on it — and a tag
  # whose run fails is a tag that is already taken, which is how v0.7.2 was
  # lost. Everything up to and including running the binary on Windows can be
  # asked for on demand now, and the answer costs nothing.
  workflow_dispatch:

permissions:
  contents: write

# The toolchain that produces the Windows binary, pinned by version and by
# digest. It comes from molto's own registry rather than from the distribution:
# apt's `gcc-mingw-w64-x86-64` links against msvcrt, whose `printf` does not
# know `%z` — the reason `__USE_MINGW_ANSI_STDIO` exists in the Makefile — and
# is several major versions behind. This one is UCRT and LLVM 23, and it is the
# same artifact `pickup install llvm-mingw` hands anyone else, so the binary
# published here is built by the supply chain this project asks others to use.
#
# Pinned by digest and not only by version because a version is a name and a
# digest is the thing. RFC-0016 makes a registry coordinate immutable, so the
# two can never disagree — and checking anyway costs one line.
env:
  MINGW_VERSION: "23.1.0"
  MINGW_SHA256: "a6a7812ee736f25345fec3842224b4c12cc795751ea2117f684f8ad59dc7022f"

jobs:
  # The one binary that cannot be made anywhere else.
  #
  # Linux and Windows are both produced on the Ubuntu runner below, because a
  # cross build is deterministic, fast and needs no queue. macOS has no such
  # option: cross-compiling to Darwin needs the Apple SDK, which does not
  # travel. So this job exists to hand the next one a file it could not have
  # built, and its result is an input rather than a check.
  #
  # `macos-14` is arm64, which is what a Mac is now. RFC-0018's non-goals
  # decline to promise x86_64 for the reason RFC-0017 declines to promise ARM64
  # Windows: nobody has measured it, and a name in a filename is a promise.
  macos:
    name: Build the macOS binary
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      # Not static, and it cannot be: Apple ships no static libSystem and does
      # not support a fully static executable. So this binary links against
      # libSystem, which is part of the operating system and is therefore
      # always there -- a different guarantee from the other two rather than a
      # weaker version of the same one, and the release notes say so rather
      # than letting parity be assumed.
      - name: Build it
        run: |
          make build CC=clang
          file build/molto
          file build/molto | grep -q 'Mach-O 64-bit executable arm64'

      # The Windows half asserts that nothing has to be unpacked beside the
      # binary. This is the same question asked of Mach-O: everything it needs
      # must come from /usr/lib, which is the OS. A Homebrew path in here is a
      # binary that runs on this runner and not on the machine it is published
      # for.
      - name: And it needs nothing beside it
        run: |
          otool -L build/molto | tail -n +2 | awk '{ print $1 }' | tee linked
          ! grep -vE '^/usr/lib/' linked

      - name: It builds and runs a project
        env:
          C_COMPILER: clang
          CPP_COMPILER: clang++
        run: |
          molto="$PWD/build/molto"
          "$molto" --version
          cd "$(mktemp -d -t molto)"
          "$molto" new smoke_test
          cd smoke_test
          "$molto" run | tee output
          grep -q "Hello, world!" output

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-binary
          path: build/molto
          retention-days: 1

  # The other two binaries, and the sums that cover all three. The Windows one
  # is cross-compiled here rather than built on a Windows runner because a
  # cross build is deterministic, fast, and needs no MSYS2 — and because what a
  # Windows runner is actually needed for is the job after next.
  #
  # It waits for the Mac because the sums have to cover everything that is
  # published, and a second SHA256SUMS written somewhere else is two files that
  # can disagree.
  build:
    name: Build what gets published
    needs: macos
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install GCC 12
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=3 gcc-12 g++-12 zstd

      # The manifest is the single source of the number, and every job below
      # reads it from here rather than from the ref — a rehearsal has a branch
      # name where a release has a tag, and the filenames must not care which.
      #
      # Under a tag the two are checked against each other. A binary whose
      # version disagrees with the tag it was published under is the one
      # failure nobody notices until much later. Same reasoning as
      # `cli_reports_the_version_the_manifest_declares`, one level up.
      - name: The version, and the tag if there is one
        id: version
        run: |
          declared=$(sed -n 's/^version = "\(.*\)"/\1/p' Project.toml | head -1)
          echo "manifest: $declared"
          echo "VERSION=$declared" >> "$GITHUB_ENV"
          echo "version=$declared" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "a rehearsal: no tag for it to agree with"
            exit 0
          fi
          tagged=${GITHUB_REF_NAME#v}
          echo "tag:      $tagged"
          test "$declared" = "$tagged"

      # Static, so the artifact does not carry the runner's glibc with it. A
      # dynamic build here needs GLIBC_2.34 and rules out Debian 11, Ubuntu
      # 20.04 and RHEL 8. Molto can afford this because it shells out to curl
      # and never resolves a hostname itself, so no NSS is linked in.
      - name: Build the static Linux binary
        run: |
          make build LDFLAGS="-static"
          file build/molto
          file build/molto | grep -q 'statically linked'

      # The artifact itself is what gets exercised, not a sibling of it.
      - name: It builds and runs a project
        env:
          C_COMPILER: gcc-12
          CPP_COMPILER: g++-12
        run: |
          molto="$PWD/build/molto"
          test "$("$molto" --version)" = "molto ${VERSION}"
          cd "$(mktemp -d)"
          "$molto" new smoke_test
          cd smoke_test
          "$molto" run | tee output
          grep -q "Hello, world!" output

      - name: Fetch the Windows toolchain
        run: |
          url=https://registry.moltobuild.dev/v1/toolchains/llvm-mingw/${MINGW_VERSION}/linux-x86_64/download
          curl -fsSL --retry 3 -o llvm-mingw.tar.zst "$url"
          echo "${MINGW_SHA256}  llvm-mingw.tar.zst" | sha256sum --check --strict
          mkdir -p toolchain
          tar --zstd -xf llvm-mingw.tar.zst -C toolchain

      # A separate BUILD_DIR, because the objects above are ELF and these are
      # PE and they share every path. Make compares timestamps, not targets,
      # and one tree would hand the linker a mixture of the two.
      - name: Cross-compile the static Windows binary
        run: |
          driver="$PWD/toolchain/bin/x86_64-w64-mingw32-clang"
          test -x "$driver"
          make build BUILD_DIR=build-windows CC="$driver" LDFLAGS="-static"
          file build-windows/molto.exe
          file build-windows/molto.exe | grep -q 'PE32+ executable'

      # UCRT ships with Windows 10 and later, so a binary that imports only it
      # and KERNEL32 needs nothing unpacked beside it. Anything else in this
      # list — `libwinpthread-1.dll`, `libgcc_s_seh-1.dll`, `libc++.dll` — is a
      # file the download would have to carry and does not, which makes it a
      # binary that runs here and not on the machine it was published for.
      - name: And it needs nothing beside it
        run: |
          strings build-windows/molto.exe \
            | grep -oiE '[A-Za-z0-9_-]+\.dll' | sort -u | tee imports
          ! grep -viE '^(api-ms-win-crt-[a-z0-9-]+\.dll|KERNEL32\.dll)$' imports

      - uses: actions/download-artifact@v8.0.1
        with:
          name: macos-binary
          path: macos

      - name: Name them, hash them, and describe them
        run: |
          mkdir -p dist
          cp build/molto "dist/molto-${VERSION}-x86_64-linux"
          cp build-windows/molto.exe "dist/molto-${VERSION}-x86_64-windows.exe"
          cp macos/molto "dist/molto-${VERSION}-arm64-macos"
          ./build/molto metadata -o "dist/molto-${VERSION}.cdx.json"
          cd dist
          sha256sum molto-* > SHA256SUMS
          cat SHA256SUMS

      - name: Write the release notes
        run: |
          cat > dist/NOTES.md <<NOTES
          ### Linux

          Static x86-64 binary. No glibc requirement, nothing to unpack.

          \`\`\`sh
          base=https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}
          curl -fsSLO \$base/molto-${VERSION}-x86_64-linux
          curl -fsSLO \$base/SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          chmod +x molto-${VERSION}-x86_64-linux
          sudo install molto-${VERSION}-x86_64-linux /usr/local/bin/molto
          \`\`\`

          ### Windows

          \`molto-${VERSION}-x86_64-windows.exe\`, x86-64, Windows 10 or later.
          Statically linked against UCRT: there is nothing to put beside it.

          Measured in CI, on a Windows runner, every push: molto's full test
          suite, \`new\`/\`build\`/\`run\` on a project — asserted against this
          exact binary before it is published — and molto building molto with
          molto. The Windows badge on the README went green on 2026-09-04 and
          is what to read for the state of the port.

          Install it with PowerShell. \`Get-FileHash\` and \`Invoke-WebRequest\`
          are built in, so there is nothing to install in order to install it:

          \`\`\`powershell
          \$base = "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          \$exe  = "molto-${VERSION}-x86_64-windows.exe"
          \$dir  = "\$env:LOCALAPPDATA\\Programs\\molto"

          New-Item -ItemType Directory -Force -Path \$dir | Out-Null
          Invoke-WebRequest "\$base/\$exe" -OutFile "\$dir\\molto.exe"
          Invoke-WebRequest "\$base/SHA256SUMS" -OutFile "\$env:TEMP\\SHA256SUMS"

          # The sums file names the file it covers, so check against that line.
          \$want = (Select-String -Path "\$env:TEMP\\SHA256SUMS" -Pattern \$exe).Line.Split()[0]
          \$got  = (Get-FileHash "\$dir\\molto.exe" -Algorithm SHA256).Hash.ToLower()
          if (\$want -ne \$got) { throw "checksum mismatch" }

          # On PATH for this user, for every shell after this one.
          [Environment]::SetEnvironmentVariable(
              "Path", [Environment]::GetEnvironmentVariable("Path", "User") + ";\$dir", "User")
          \`\`\`

          Open a new terminal, then \`molto new hello\` and \`molto run\`.

          ### macOS

          \`molto-${VERSION}-arm64-macos\`, Apple Silicon, and the full suite
          passes on a macOS runner (RFC-0018).

          \`\`\`sh
          base=https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}
          curl -fsSLO \$base/molto-${VERSION}-arm64-macos
          curl -fsSLO \$base/SHA256SUMS
          shasum -a 256 --check --ignore-missing SHA256SUMS
          chmod +x molto-${VERSION}-arm64-macos
          sudo install molto-${VERSION}-arm64-macos /usr/local/bin/molto
          \`\`\`

          Two things this binary does not claim, both worth knowing before you
          run it:

          **It is not signed or notarised.** Downloaded with \`curl\` that
          changes nothing — the command above works as written. Downloaded with
          a **browser**, macOS attaches a quarantine attribute and refuses to
          start it with a message about an unverified developer. Remove it, or
          open the file once from Finder with a right click:

          \`\`\`sh
          xattr -d com.apple.quarantine molto
          \`\`\`

          **It is not static, and cannot be.** Apple ships no static libSystem
          and does not support a fully static executable, so this links against
          libSystem — which is part of the operating system and therefore
          always present. Nothing has to be unpacked beside it, and CI asserts
          that every library it names lives under \`/usr/lib\`.

          Intel Macs are not covered. Nobody has measured one, and RFC-0018
          declines to promise what has not been measured.

          ### Choosing a compiler

          **Molto does not choose one**, it asks [pickup][pickup]. Install that
          and molto finds a toolchain by itself; without it, name one by hand:

          \`\`\`sh
          export C_COMPILER=gcc CPP_COMPILER=g++
          \`\`\`

          Without either, \`new\`, \`init\`, \`add\`, \`remove\` and \`metadata\` work, and
          \`build\`, \`test\`, \`fmt\` and \`lint\` report that no compiler was resolved.

          \`molto-${VERSION}.cdx.json\` is molto's own CycloneDX bill of materials.

          [pickup]: https://github.com/moltobuild/pickup/releases/latest
          NOTES
          cat dist/NOTES.md

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

  # A cross build says the binary is well-formed. It cannot say the binary does
  # molto's job, and RFC-0017's most expensive lesson is that the gap between
  # those two is where every real failure of this port has lived: it compiled,
  # it linked, it started, it found no compiler, it found the wrong one. So the
  # artifact that is about to be published is run on the platform it is for,
  # before anyone can download it.
  windows:
    name: The Windows binary does molto's job
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.build.outputs.version }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist

      # MSYS2 is here for the compiler it brings, not for the shell: nothing
      # in this job builds molto, it runs the binary the last one produced.
      # `C_COMPILER=gcc` skips pickup on purpose — pickup on Windows is its own
      # release with its own bars, and a red here has to be attributable to
      # this binary and to nothing standing behind it.
      - uses: msys2/setup-msys2@v2.32.0
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: The download is the file that was hashed
        run: sha256sum --check --ignore-missing SHA256SUMS

      - name: It builds and runs a project
        env:
          C_COMPILER: gcc
        run: |
          molto="$PWD/molto-${VERSION}-x86_64-windows.exe"
          chmod +x "$molto"
          test "$("$molto" --version)" = "molto ${VERSION}"
          cd "$(mktemp -d)"
          "$molto" new smoke_test
          cd smoke_test
          "$molto" run | tee output
          grep -q "Hello, world!" output

  # The same question the Windows job asks, on the platform it is about: does
  # the file that is about to be published do molto's job there?
  #
  # The build job already ran this binary on a Mac, and this is not that. What
  # is checked here is the artifact *after* it has been named, hashed and
  # carried between two jobs -- the download is the file that was hashed --
  # which is the property a person downloading it depends on and the one no
  # amount of testing at build time can establish.
  macos-check:
    name: The macOS binary does molto's job
    needs: build
    runs-on: macos-14
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist

      # `shasum -a 256` and not `sha256sum`: macOS ships Perl's and no GNU
      # coreutils at all, which is the same difference that kept molto from
      # verifying any archive dependency there until RFC-0018's port found it.
      - name: The download is the file that was hashed
        run: shasum -a 256 --check --ignore-missing SHA256SUMS

      # `C_COMPILER` skips pickup on purpose, for the reason the Windows job
      # gives: pickup on macOS is its own release with its own bars, and a red
      # here has to be attributable to this binary.
      - name: It builds and runs a project
        env:
          C_COMPILER: clang
          CPP_COMPILER: clang++
        run: |
          molto="$PWD/molto-${VERSION}-arm64-macos"
          chmod +x "$molto"
          test "$("$molto" --version)" = "molto ${VERSION}"
          cd "$(mktemp -d -t molto)"
          "$molto" new smoke_test
          cd smoke_test
          "$molto" run | tee output
          grep -q "Hello, world!" output

  # A tag is what publishes. A rehearsal proves everything above this line and
  # then stops, which is the whole point of it.
  publish:
    name: Publish
    needs: [build, windows, macos-check]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "molto ${VERSION}" \
            --notes-file dist/NOTES.md \
            --generate-notes \
            "dist/molto-${VERSION}-x86_64-linux" \
            "dist/molto-${VERSION}-x86_64-windows.exe" \
            "dist/molto-${VERSION}-arm64-macos" \
            "dist/molto-${VERSION}.cdx.json" \
            dist/SHA256SUMS
