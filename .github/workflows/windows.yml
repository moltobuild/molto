name: Windows

# Deliberately not part of `ci.yml`.
#
# This file measures how far molto's Windows port has got; `ci.yml` is what has
# to be green. When this one is green too it moves into `ci.yml`, and that move
# is the definition of "supported" in RFC-0017.
#
# It is not a gate. Nothing requires it, and a pull request merges with it red
# — which is the whole reason it can afford to be red. What it is instead is a
# progress report, and the README carries its badge, so the state of the port
# is a thing anyone can see without opening a run.
#
# That badge is why the jobs no longer carry `continue-on-error` themselves.
# A run whose every job is excused reports success, and a green badge over a
# tree that does not compile for Windows is worse than no badge: it is the
# `Compiles for Windows` tick this file was built to stop anyone from
# believing. The flag stays on the individual steps, which is what lets each
# one measure rather than stop at the first failure, and `Where the port
# stands` ends each job the way the port really is.
#
# Pickup went through this same file first, and what it learnt shapes this one:
# compiling proves almost nothing. Its port failed at link (mingw declares
# `nanosleep` and does not provide it), at discovery (`gcc` is not a filename,
# `gcc.exe` is) and at meaning (`PATH` separates on `;`, and a colon belongs to
# a drive letter) — three layers a compiler cannot see. So half two builds and
# *runs*, and asks its questions in that order.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  # Half one: does molto compile for Windows at all?
  #
  # Asked on a Linux runner with a cross compiler, because it needs no Windows
  # queue and no MSYS2 install — a minute against ten. It catches every missing
  # declaration and every struct field that differs, which is what stands
  # between here and a binary.
  #
  # Read out of the source before this job ever ran, so the first number it
  # prints can be checked against an expectation:
  #
  #   - `fork` + `pipe` + `dup2` + `waitpid` + `poll` in `process_service.c`,
  #     which has to become `CreateProcess`. Bigger than pickup's was: molto
  #     streams a compiler's output through a poll loop while it runs.
  #   - `flock` in `wsdb.c:748`, the single-writer lock, which is `LockFileEx`.
  #   - `symlink()` in `build_service.c:1275`, the two links beside a shared
  #     library. Not a substitution: Windows symlinks need a privilege or
  #     Developer Mode, so this is a design question RFC-0017 has to answer.
  #   - `sys/ioctl.h` in `viewport.c` and `termios.h` in `conflict_prompt.c`,
  #     which are the console API.
  #   - `realpath` seven times, plus `mkdtemp`, `mkstemp`, `lstat`, `chmod`
  #     and `access` — every one of which pickup's `fs_service` already
  #     answered, so molto copies rather than invents.
  #   - `<threads.h>`, C11 rather than pthreads, in `task_pool`, `loader` and
  #     `report`. Whether mingw provides it is a question for this job, not
  #     for a reading of the source.
  #
  # And one the reading missed, which the first run of this job found in the
  # very first file it compiled: `<fnmatch.h>` in `style_config.c`, the glob
  # matching behind `format.json`'s exclusions. mingw has no such header. It
  # was missed because the sweep looked for a fixed list of POSIX headers and a
  # fixed list of POSIX calls, and `fnmatch` was in neither — the same shape of
  # miss as the `/tmp` inside a `#define` that pickup's sweep walked past. A
  # sweep finds what it was told to look for, which is why this job exists.
  #
  # What this job cannot say anything about is how the binary behaves. That is
  # the whole reason half two exists.
  cross:
    name: Compiles for Windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install the mingw-w64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=3 gcc-mingw-w64-x86-64

      # `-k` is what makes this a measurement rather than a tripwire. Without
      # it make stops at the first translation unit that fails, and the port
      # is reported as one error out of an unknown number — which is how this
      # job first ran, and it said `fnmatch.h: No such file or directory` and
      # nothing else about a tree of sixty-six files.
      #
      # The step still exits with make's status, so the job stays honest; the
      # tally is printed first, and `continue-on-error` on the step itself is
      # what lets the next one run. Job-level `continue-on-error` does not do
      # that — it spares the workflow, not the steps after a red one.
      - name: Compile molto for Windows
        id: sources
        continue-on-error: true
        run: |
          set +e
          make -k build CC=x86_64-w64-mingw32-gcc 2>&1 | tee compile.log
          status=${PIPESTATUS[0]}
          ./.github/tally.sh compile.log "molto for Windows"
          exit $status

      # Built and not run: these are Windows binaries on a Linux runner.
      # Running them is half two's job. Building them is still worth doing
      # here, because the suite has POSIX of its own, and a port whose tests
      # cannot be compiled is a port that cannot be proven.
      #
      # Only once `src/` compiles, though, and that `if` is not caution. The
      # test binary links every object under `src/`, so this step rebuilds them
      # all before it reaches a single file under `tests/` — which meant it
      # re-reported the same fourteen errors, the verdict added them to the
      # fourteen it already had, and the job announced 28 errors that did not
      # exist. A measurement that counts the same thing twice is worse than no
      # measurement, because it looks like data.
      - name: Compile its suite for Windows
        if: steps.sources.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          make -k build/molto_tests CC=x86_64-w64-mingw32-gcc 2>&1 | tee suite.log
          status=${PIPESTATUS[0]}
          ./.github/tally.sh suite.log "its suite for Windows"
          exit $status

      - name: And it really is a Windows binary
        if: steps.sources.outcome == 'success'
        continue-on-error: true
        run: file build/molto* | grep -q 'PE32+ executable'

      # The job ends the way the port stands, and `continue-on-error` on the
      # job is what keeps that from blocking anyone. That flag exists for
      # exactly this: a watch that reports honestly without gating. It comes
      # off, along with this step, when the tally reaches zero.
      - name: Where the port stands
        run: |
          if [ ! -f tally.count ]; then
            echo "no tally was produced, which is its own kind of red"
            exit 1
          fi
          total=$(awk '{ sum += $1 } END { print sum + 0 }' tally.count)
          echo "$total between here and a supported platform"
          test "$total" -eq 0

  # Half two: does the binary do molto's job?
  #
  # It has to be a Windows runner, because the question is about behaviour and
  # no cross build can answer it.
  windows:
    name: Runs on Windows
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7.0.1

      # MSYS2 rather than the runner's own MinGW: it brings `make`, which the
      # bootstrap Makefile needs, and a gcc from the same family the cross job
      # compiles with, so the two halves disagree about as little as possible.
      # TODO: pin to an exact tag, the way every other action here is pinned.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc

      # `CC=gcc` because the bootstrap Makefile reaches for `gcc-12` when
      # nobody names a compiler, and MSYS2 calls its own `gcc`. The Makefile is
      # right to pin a version on the machine it was written for, so the
      # override belongs here.
      - name: Build
        continue-on-error: true
        run: |
          set +e
          make -k build CC=gcc 2>&1 | tee compile.log
          status=${PIPESTATUS[0]}
          ./.github/tally.sh compile.log "molto on Windows"
          exit $status

      # Before the suite, deliberately. A job that stops at the first failure
      # reports whatever it reached, and "does it build a program at all" is
      # the headline this job exists to answer — worth more, while the port is
      # in progress, than knowing which of eight hundred cases went red.
      #
      # `C_COMPILER=gcc` skips pickup on purpose. Pickup on Windows is its own
      # port with its own tally, and mixing the two would make a red here
      # unattributable. What is under test is molto's own machinery: spawning
      # a process, walking a directory, taking the workspace lock, and getting
      # an executable out the other end.
      - name: It builds and runs a project
        continue-on-error: true
        env:
          C_COMPILER: gcc
          CPP_COMPILER: g++
        run: |
          set +e
          here=$PWD
          (
            set -e
            molto="$here/build/molto"
            "$molto" --version
            cd "$(mktemp -d)"
            "$molto" new smoke_test
            cd smoke_test
            "$molto" run | tee output
            grep -q "Hello, world!" output
          )
          status=$?
          # The tally counts compiler errors, and this step asks a question no
          # compiler answers. A molto that builds and cannot build anything is
          # the failure this job exists for, so it counts itself.
          [ $status -eq 0 ] || echo 1 >> "$here/tally.count"
          exit $status

      # The claim this job exists to check, and the one nobody was checking.
      #
      # Everything above builds molto with the bootstrap Makefile, which is not
      # how molto is built — `ci.yml` has a `self-host` job for that, and it
      # runs on Ubuntu only. So "molto builds molto" and "molto runs on
      # Windows" were both true and had never met.
      #
      # `C_COMPILER` for the same reason the smoke test uses it: pickup on
      # Windows is its own port with its own tally, and a red here has to be
      # attributable to molto.
      - name: And molto builds molto with molto
        continue-on-error: true
        env:
          C_COMPILER: gcc
          CPP_COMPILER: g++
        run: |
          set +e
          ./build/molto build
          status=$?
          [ $status -eq 0 ] || echo 1 >> tally.count
          exit $status

      # Reported rather than skipped: skipping edits the tests to hide them,
      # while this leaves every failure printed and counted, so the tally is a
      # number to watch move.
      #
      # It counts toward the verdict, and that is a change from when this file
      # was a private measurement. The README now carries the badge, and a
      # green badge is a claim that Windows is supported — which RFC-0017
      # defines as the suite passing, not as the tree compiling. The first run
      # that ever reached this step reported 680 passed and 163 failed, and
      # every gate above it was green: without this, the badge would have gone
      # green over that.
      # The same compiler `ci.yml` hands its own suite, and for the same
      # reason. Some of these tests do not fake a compiler at all: they write
      # C++ that uses `<string>`, build it, and run what comes out. Without a
      # compiler those cannot pass on any platform, and on Linux they do only
      # because `ci.yml` sets these two at the workflow level.
      #
      # This was tried once before and reverted, correctly: at the time the
      # fakes were `#!/bin/sh` files that Windows cannot start, so the run came
      # back byte-identical and the variable was hiding nothing and fixing
      # nothing. The fakes are real programs now, and what is left in
      # `build_service` says `could not run 'pickup' to resolve the compiler`
      # in as many words.
      - name: Run the suite (watched, not yet a gate)
        continue-on-error: true
        env:
          C_COMPILER: gcc
          CPP_COMPILER: g++
        run: |
          set +e
          # -v names each test as it runs. Without it a crash leaves a row of
          # dots, and working out which case died means counting them against
          # the order the file registers in -- which is what the last three
          # rounds cost. The suite already knew the answer.
          #
          # It could not be passed until now: with a stub reading a stdin
          # nobody was writing, -v hung the run outright. That was the child
          # inheriting the build's own standard input, fixed in #51.
          make test CC=gcc TEST_ARGS=-v 2>&1 | tee suite.log
          status=${PIPESTATUS[0]}
          failed=$(sed -n 's/.*[^0-9]\([0-9][0-9]*\) failed.*/\1/p' suite.log | tail -1)
          if [ -n "$failed" ] && [ "$failed" -gt 0 ]; then
            echo "$failed" >> tally.count
            echo "### The suite on Windows" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "$failed tests still fail." >> "$GITHUB_STEP_SUMMARY"
          elif [ $status -ne 0 ]; then
            # It failed without reporting a tally: the binary did not run, or
            # it died partway. Counted as one so the verdict cannot read that
            # as nothing wrong.
            echo 1 >> tally.count
          fi
          exit $status

      # The job ends the way the port stands, and `continue-on-error` on the
      # job is what keeps that from blocking anyone. That flag exists for
      # exactly this: a watch that reports honestly without gating. It comes
      # off, along with this step, when the tally reaches zero.
      - name: Where the port stands
        run: |
          if [ ! -f tally.count ]; then
            echo "no tally was produced, which is its own kind of red"
            exit 1
          fi
          total=$(awk '{ sum += $1 } END { print sum + 0 }' tally.count)
          echo "$total between here and a supported platform"
          test "$total" -eq 0
